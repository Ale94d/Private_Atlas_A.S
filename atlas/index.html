<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas | Private Atlas A.S</title>

    <link rel="stylesheet" href="styles.css">

     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">
</head>

<body>

    <main class="atlas-workspace">

    <aside class="atlas-progress">

    </aside>

    <section class="atlas-map">

    <aside class="scroll-left">

        <button class="scroll-btn back-btn">
            <i class="icon-arrow-left"></i>
        </button>


    </aside>

    <div class="map-background">

        <div id="map-container">

            <object
                id="world-map"
                data="assets/Maps/world.svg"
                type="image/svg+xml">
            </object>

        </div>

    </div>

    <aside class="scroll-right">

        <button class="scroll-btn search-btn">
            <i class="icon-search"></i>
        </button>

        <button class="scroll-btn favorite-btn">
            <i class="icon-star"></i>
        </button>

        <button class="scroll-btn memory-btn">
            <i class="icon-location"></i>
        </button>

    </aside>

</section>

    </main>

    <div class="atlas-card">

    </div>

    <div id="country-memory">

    <div class="memory-paper">

        <h2>País</h2>

        <p>Aquí aparecerán los recuerdos.</p>

        <button id="close-memory">

            Cerrar

        </button>

    </div>

</div>

    <script src="script.js"></script>
