<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas | Private Atlas A.S</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="atlas-header">

        <button class="back-home">
            Inicio
        </button>

        <div class="atlas-title">
            <h1
            >🧭Atlas</h1>
            <p> Explora el mundo,conserva tus recuerdos</p>
        </div>

        <div class="atlas-location">
        🌎 Mundo
    </div>

    </header>

    <main class="atlas-workspace">

    <aside class="atlas-progress">

    </aside>

    <section class="atlas-map">

        <div class="scroll-left"></div>

        <div class="map-background">
           <object
            id="world-map"
            data="assets/Maps/world.svg"
            type="image/svg+xml">
            </object>
        </div>

        <div class="scroll-right"></div>
        
    </section>

    </main>

    <div class="atlas-card">

    </div>


    <script src="script.js"></script>

</body>

</html>
