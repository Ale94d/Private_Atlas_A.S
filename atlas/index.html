<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas | Private Atlas A.S</title>

    <link rel="stylesheet" href="styles.css">

     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">

     <link rel="icon" type="image/png" href="assets/icons/favicon-atlas.png">
</head>

<body>
    


    <main class="atlas-workspace">

    <aside class="atlas-progress">

    </aside>

    <section class="atlas-map">

    <aside class="scroll-left">

    <button class="scroll-btn back-home">
        <i class="icon-home"></i>
    </button>


</aside>

    <div class="map-background">

        <div id="map-container">

            <object
                id="world-map"
                data="assets/Maps/world.svg"
                type="image/svg+xml">
            </object>

        </div>

        <div id="selected-country" class="selected-country">
            
            <h2 id="country-name">Selecciona un país</h2>
            <p id="country-message">
                Haz clic sobre un país del mapa para comenzar</p>

        </div>

    </div>

    <aside class="scroll-right">

        <button class="scroll-btn search-btn">
            <i class="icon-search"></i>
        </button>

        <button class="scroll-btn favorite-btn">
            <i class="icon-star"></i>
        </button>

        <button class="scroll-btn memory-btn">
            <i class="icon-map-pin"></i>
        </button>

    </aside>

</section>

    </main>

    <div class="atlas-card">

    </div>

    <!-- =========================================
     VENTANA DEL PAÍS
========================================= -->

<div id="country-memory">

    <div class="memory-paper">

        <button id="close-memory" type="button">
            <i data-lucide="x"></i>
        </button>

        <div class="memory-paper-header">

            <span class="memory-location-icon">
                <i data-lucide="map-pin"></i>
            </span>

            <div>
                <h2 id="memory-country-name">
                    País
                </h2>

                <p id="memory-country-description">
                    Aquí aparecerán tus recuerdos de este lugar.
                </p>
            </div>

        </div>

        <div id="country-memories">
            <!-- Aquí aparecerán las Polaroid -->
        </div>

        <div class="memory-empty-message">
            <p>
                Todavía no tienes recuerdos guardados aquí.
            </p>
        </div>

        <button id="add-memory-btn" type="button">
            <i data-lucide="plus"></i>
            Agregar recuerdo
        </button>

    </div>

</div>

    <div id="memory-form-container">

    <div class="memory-form">

        <button id="close-memory-form" type="button">
            <i data-lucide="x"></i>
        </button>

        <h2>Nuevo recuerdo</h2>

        <form id="memory-form">

            <div class="form-group">
                <label for="memory-title">Título</label>
                <input
                    type="text"
                    id="memory-title"
                    placeholder="Ej. Viaje a Cartagena"
                    required
                >
            </div>

            <div class="form-group">
                <label for="memory-description">Descripción</label>
                <textarea
                    id="memory-description"
                    placeholder="Cuenta un poco sobre este recuerdo..."
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label for="memory-date">Fecha</label>
                <input
                    type="date"
                    id="memory-date"
                >
            </div>

            <div class="form-group">
                <label for="memory-image">Fotografía</label>
                <input
                    type="file"
                    id="memory-image"
                    accept="image/*"
                >
            </div>

            <button type="submit" id="save-memory-btn">
                <i data-lucide="save"></i>
                Guardar recuerdo
            </button>

        </form>
    </div>
</div>

    <script src="script.js"></script>

</body>

</html>
