<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Baúl | Private Atlas A.S.</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="styles.css">

    <link rel="icon" type="image/png" href="assets/icons/favicon-baul.png">

</head>

<body>

<!-- =====================================
     TRANSICIÓN DE LAVA
===================================== -->

<div class="lava-transition">
    <div class="lava-body"></div>
</div>

<div class="ash-particles">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>


<div class="embers">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>


<div class="flames">

    <span></span>
    <span></span>
    <span></span>

</div>

    <main class="baul-workspace">

        <!-- BOTÓN HOME -->

        <button
            class="back-home"
            type="button"
            aria-label="Volver al Home">

            <i data-lucide="house"></i>


        </button>




        <section class="baul-chamber">

            <div class="baul-rock">

            

                <div class="books-window">

    <div class="books-header">
        <div>
            <h2>Mis libros</h2>
            <p>Guarda lo que esperas y lo que piensas de cada libro.</p>
        </div>

        <button class="add-book-btn" id="openAddBook">
            + Agregar libro
        </button>
    </div>

    <div class="books-grid" id="booksGrid">
        <!-- Los libros aparecerán aquí -->
    </div>

</div>


<!-- =====================================
     FORMULARIO AGREGAR LIBRO
===================================== -->

<div class="book-form-overlay" id="bookFormOverlay">

    <div class="book-form">

        <button class="close-book-form" id="closeBookForm">
            ×
        </button>

        <h2>Agregar libro</h2>

        <form id="bookForm">

            <label>Título</label>
            <input type="text" id="bookTitle" required>

            <label>Autor</label>
            <input type="text" id="bookAuthor" required>

            <label>Género</label>
            <select id="bookGenre" required>
                <option value="">Selecciona un género</option>
                <option value="Fantasía">Fantasía</option>
                <option value="Romance">Romance</option>
                <option value="Misterio">Misterio</option>
                <option value="Terror">Terror</option>
                <option value="Ciencia ficción">Ciencia ficción</option>
                <option value="Historia">Historia</option>
                <option value="Otro">Otro</option>
            </select>

            <label>Portada</label>
            <input type="file" id="bookCover" accept="image/*">

            <label>Expectativas</label>
            <textarea
                id="bookExpectations"
                placeholder="¿Qué esperas encontrar en este libro?"
            ></textarea>

            <label>Reseña</label>
            <textarea
                id="bookReview"
                placeholder="Escribe tu opinión después de leerlo..."
            ></textarea>

            <label class="favorite-option">
                <input type="checkbox" id="bookFavorite">
                Marcar como favorito
            </label>

            <button type="submit" class="save-book-btn">
                Guardar libro
            </button>

        </form>

    </div>

</div>


                    <button
                        class="baul-window recipes-window"
                        type="button">

                        <i data-lucide="chef-hat"></i>
                        <span>Recetas</span>

                    </button>


                    <button
                        class="baul-window travel-window"
                        type="button">

                        <i data-lucide="plane"></i>
                        <span>Viajes</span>

                    </button>

                </div>

            </div>

        </section>

<div class="content-overlay">

    <section class="content-window books-content">

        <button class="close-window" type="button" aria-label="Cerrar">
            <i data-lucide="x"></i>
        </button>

        <div class="content-window-header">
            <i data-lucide="book-open"></i>
            <h2>Libros</h2>
        </div>

        <div class="content-window-body">
        </div>

    </section>


    <section class="content-window recipes-content">

        <button class="close-window" type="button" aria-label="Cerrar">
            <i data-lucide="x"></i>
        </button>

        <div class="content-window-header">
            <i data-lucide="chef-hat"></i>
            <h2>Recetas</h2>
        </div>

        <div class="content-window-body">
        </div>

    </section>


   <section class="content-window travel-content">

    <button class="close-window" type="button" aria-label="Cerrar">
        <i data-lucide="x"></i>
    </button>

    <div class="content-window-header">
        <i data-lucide="plane"></i>
        <h2>Viajes</h2>
    </div>

    <div class="content-window-body">
    </div>

</section>

</div>


    </main>

    <script
    src="https://unpkg.com/lucide@latest"></script>


    <script src="script.js"></script>

</body>

</html>
