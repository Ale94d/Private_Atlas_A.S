<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Baúl | Private Atlas A.S.</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="styles.css">

    <link rel="icon" type="image/png" href="assets/icons/favicon-baul.png">

</head>

<body>

    <!-- =====================================
         BAÚL
    ====================================== -->

    <main class="baul-workspace">

        <!-- BOTÓN HOME -->

        <button
            class="back-home"
            type="button"
            aria-label="Volver al Home">

            <i data-lucide="house"></i>


        </button>


        <!-- =====================================
             CÁMARA DEL BAÚL
        ====================================== -->

        <section class="baul-chamber">

            <div class="baul-rock">

                <!-- =====================================
                     VENTANITAS
                ====================================== -->

                <div class="baul-windows">

                    <button
                        class="baul-window books-window"
                        type="button">

                        <i data-lucide="book-open"></i>
                        <span>Libros</span>

                    </button>


                    <button
                        class="baul-window recipes-window"
                        type="button">

                        <i data-lucide="chef-hat"></i>
                        <span>Recetas</span>

                    </button>


                    <button
                        class="baul-window travel-window"
                        type="button">

                        <i data-lucide="plane"></i>
                        <span>Viajes</span>

                    </button>

                </div>

            </div>

        </section>

    </main>

    <script
    src="https://unpkg.com/lucide@latest"></script>


    <script src="script.js"></script>

</body>

</html>
