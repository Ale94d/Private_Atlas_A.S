<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Baúl | Private Atlas A.S.</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="styles.css">

    <link rel="icon" type="image/png" href="assets/icons/favicon-baul.png">

</head>

<body>

    <!-- PARTÍCULAS DE CENIZA -->

<div class="ash-particles">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>

<!-- BRASAS -->

<div class="embers">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>


<!-- LLAMAS -->

<div class="flames">

    <span></span>
    <span></span>
    <span></span>

</div>




    <!-- =====================================
         BAÚL
    ====================================== -->

    <main class="baul-workspace">

        <!-- BOTÓN HOME -->

        <button
            class="back-home"
            type="button"
            aria-label="Volver al Home">

            <i data-lucide="house"></i>


        </button>


        <!-- =====================================
             CÁMARA DEL BAÚL
        ====================================== -->

        <section class="baul-chamber">

            <div class="baul-rock">

                <!-- =====================================
                     VENTANITAS
                ====================================== -->

                <div class="baul-windows">

                    <button
                        class="baul-window books-window"
                        type="button">

                        <i data-lucide="book-open"></i>
                        <span>Libros</span>

                    </button>


                    <button
                        class="baul-window recipes-window"
                        type="button">

                        <i data-lucide="chef-hat"></i>
                        <span>Recetas</span>

                    </button>


                    <button
                        class="baul-window travel-window"
                        type="button">

                        <i data-lucide="plane"></i>
                        <span>Viajes</span>

                    </button>

                </div>

            </div>

        </section>

        <!-- =====================================
     VENTANA DE CONTENIDO
===================================== -->

<div class="content-overlay">

    <section class="content-window books-content">

        <button class="close-window" type="button" aria-label="Cerrar">
            <i data-lucide="x"></i>
        </button>

        <div class="content-window-header">
            <i data-lucide="book-open"></i>
            <h2>Libros</h2>
        </div>

        <div class="content-window-body">
        </div>

    </section>


    <section class="content-window recipes-content">

        <button class="close-window" type="button" aria-label="Cerrar">
            <i data-lucide="x"></i>
        </button>

        <div class="content-window-header">
            <i data-lucide="chef-hat"></i>
            <h2>Recetas</h2>
        </div>

        <div class="content-window-body">
        </div>

    </section>


   <section class="content-window travel-content">

    <button class="close-window" type="button" aria-label="Cerrar">
        <i data-lucide="x"></i>
    </button>

    <div class="content-window-header">
        <i data-lucide="plane"></i>
        <h2>Viajes</h2>
    </div>

    <div class="content-window-body">
    </div>

</section>

</div>

<div class="lava-transition">
    <div class="lava-layer"></div>
    <div class="lava-glow"></div>
</div>

    </main>

    <script
    src="https://unpkg.com/lucide@latest"></script>


    <script src="script.js"></script>

</body>

</html>
