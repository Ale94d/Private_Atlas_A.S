<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Timeline | Private Atlas A.S.</title>

    <!-- FUENTES -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- FAVICON -->
    <link rel="icon"
          type="image/png"
          href="assets/icons/favicon-timeline.png">

</head>


<body>

    <!-- =====================================
         ENTRADA
    ====================================== -->

    <div class="timeline-entrance">

        <div class="timeline-door timeline-door-left"></div>

        <div class="timeline-door timeline-door-right"></div>

    </div>


    <!-- =====================================
         ESPACIO PRINCIPAL
    ====================================== -->

    <main class="timeline-workspace">


        <!-- BOTÓN HOME -->

        <button
            class="back-home"
            type="button"
            aria-label="Volver al Home">

            <i data-lucide="house"></i>

        </button>


        <!-- =====================================
             ESPACIO ARQUITECTÓNICO
        ====================================== -->

        <section class="timeline-container">


            <!-- MUNDO -->

            <div class="timeline-world">


                <!-- PARED DEL FONDO -->

                <div class="marble-wall">

                    <div class="greek-border top-border"></div>

                    <div class="background-columns">


                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>


                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>


                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>


                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>


                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>


                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>

                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>

                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>

                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>

                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>

                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>

                        <div class="column">
                            <div class="column-capital"></div>
                            <div class="column-shaft"></div>
                            <div class="column-base"></div>
                        </div>


                    </div>


                    

                </div>


                <!-- =====================================
                     TIMELINE
                ====================================== -->

                <div class="timeline-line"></div>


                <!-- RECUERDO 1 -->

                <article
                    class="timeline-event"
                    style="left: 500px;">

                    <div class="timeline-dot">
                        ★
                    </div>

                    <div class="timeline-card">

                        <span class="timeline-date">
                            2026
                        </span>

                        <h2>
                            El comienzo
                        </h2>

                        <p>
                            Private Atlas comienza a tomar forma.
                        </p>

                    </div>

                </article>


                <!-- RECUERDO 2 -->

                <article
                    class="timeline-event"
                    style="left: 1200px;">

                    <div class="timeline-dot">
                        ★
                    </div>

                    <div class="timeline-card">

                        <span class="timeline-date">
                            2026
                        </span>

                        <h2>
                            Un nuevo recuerdo
                        </h2>

                        <p>
                            Aquí aparecerá otro momento especial.
                        </p>

                    </div>

                </article>


                <!-- RECUERDO 3 -->

                <article
                    class="timeline-event"
                    style="left: 2000px;">

                    <div class="timeline-dot">
                        ★
                    </div>

                    <div class="timeline-card">

                        <span class="timeline-date">
                            2026
                        </span>

                        <h2>
                            Un nuevo capítulo
                        </h2>

                        <p>
                            La historia continúa.
                        </p>

                    </div>

                </article>


            </div>

        </section>

    </main>


    <!-- ICONOS -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
