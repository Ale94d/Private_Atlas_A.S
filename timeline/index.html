<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Timeline | Private Atlas A.S.</title>

    <!-- FUENTES -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="styles.css">

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="assets/icons/favicon-timeline.png">

</head>


<body>

    <!-- =====================================
         PUERTA DE ENTRADA
    ====================================== -->

    <div class="timeline-entrance">

        <div class="timeline-door timeline-door-left"></div>

        <div class="timeline-door timeline-door-right"></div>

    </div>


    <!-- =====================================
         TIMELINE
    ====================================== -->

    <main class="timeline-workspace">

        <header class="timeline-header">

            <div class="timeline-title">

                <span>PRIVATE ATLAS</span>

                <h1>Timeline</h1>

                <p>
                    Tus momentos, en el paso del tiempo.
                </p>

            </div>


            <button
                class="back-home"
                type="button"
                aria-label="Volver al Home">

                <i data-lucide="house"></i>

            </button>

        </header>


        <!-- =====================================
             ESPACIO DE LA CRONOLOGÍA
        ====================================== -->

        <section class="timeline-container">

            <div class="timeline-world">

                <div class="timeline-line"></div>


                <!-- RECUERDO 1 -->

                <article
                    class="timeline-event"
                    style="left: 500px;">

                    <div class="timeline-dot">
                        ★
                    </div>

                    <div class="timeline-card">

                        <span class="timeline-date">
                            2026
                        </span>

                        <h2>
                            El comienzo
                        </h2>

                        <p>
                            Private Atlas comienza a tomar forma.
                        </p>

                    </div>

                </article>


                <!-- RECUERDO 2 -->

                <article
                    class="timeline-event"
                    style="left: 1200px;">

                    <div class="timeline-dot">
                        ★
                    </div>

                    <div class="timeline-card">

                        <span class="timeline-date">
                            2026
                        </span>

                        <h2>
                            Un nuevo recuerdo
                        </h2>

                        <p>
                            Aquí aparecerá otro momento especial.
                        </p>

                    </div>

                </article>


                <!-- RECUERDO 3 -->

                <article
                    class="timeline-event"
                    style="left: 2000px;">

                    <div class="timeline-dot">
                        ★
                    </div>

                    <div class="timeline-card">

                        <span class="timeline-date">
                            2026
                        </span>

                        <h2>
                            Un nuevo capítulo
                        </h2>

                        <p>
                            La historia continúa.
                        </p>

                    </div>

                </article>

            </div>

        </section>

    </main>


    <!-- ICONOS -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
