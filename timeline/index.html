<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Timeline | Private Atlas A.S.</title>

    <!-- FUENTES -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="styles.css">

    <!-- FAVICON -->
    <link rel="icon"
          type="image/png"
          href="assets/favicon/favicon-timeline.png">

</head>


<body>

    <!-- =====================================
         CONTENEDOR PRINCIPAL
    ====================================== -->

    <main class="timeline-workspace">


        <!-- =====================================
             ENCABEZADO
        ====================================== -->

        <header class="timeline-header">

            <div class="timeline-title">

                <h1>Timeline</h1>

                <p>
                    Tus momentos, en el paso del tiempo.
                </p>

            </div>


            <button class="back-home"
                    type="button"
                    aria-label="Volver al Home">

                <i data-lucide="house"></i>

            </button>

        </header>


        <!-- =====================================
             CONTENIDO DE LA CRONOLOGÍA
        ====================================== -->

        <section class="timeline-container">

            <div class="timeline-line"></div>


            <!-- EVENTO DE EJEMPLO -->

            <article class="timeline-event">

                <div class="timeline-dot"></div>

                <div class="timeline-card">

                    <span class="timeline-date">
                        2026
                    </span>

                    <h2>
                        Un nuevo recuerdo
                    </h2>

                    <p>
                        Aquí aparecerá la descripción
                        de tu acontecimiento.
                    </p>

                </div>

            </article>


        </section>

    </main>


    <!-- ICONOS -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
