<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Private Atlas A.S.</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="styles.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css">

    <link rel="icon" type="image/png" href="assets/icons/favicon-home.png">

</head>

<body>

<header class="hero">

    <img
        src="assets/images/logo.png"
        alt="Private Atlas"
        class="logo">

    <p class="slogan">
        Tus recuerdos viajan contigo
    </p>

</header>

<main class="home">

    <div class="workspaces">

        <div class="workspace atlas">

            <div class="circle">
                <i class="icon-compass"></i>
            </div>

            <span>Atlas</span>

        </div>

        <div class="workspace planner">

            <div class="circle">
                <i class="icon-calendar-days"></i>
            </div>

            <span>Life Planner</span>

        </div>

        <div class="workspace journal">

            <div class="circle">
                <i class="icon-book-open"></i>
            </div>

            <span>Daily Journal</span>

        </div>

        <div class="workspace baul">

            <div class="circle">
                <i class="icon-package"></i>
            </div>

            <span>Baúl</span>

        </div>

        <div class="workspace timeline">

            <div class="circle">
                <i class="icon-clock-3"></i>
            </div>

            <span>Timeline</span>

        </div>

    </div>

</main>
<!-- =====================================
     BOTÓN PERSONALIZAR
===================================== -->


<div class="profile-btn">

    <div class="profile-circle">
        
        <img
        src="assets/images/profile.png"
        alt="Perfil">

    </div>

    <div class="profile-menu">

        <h2>Perfil</h2>
        <button class="login-btn">
            Iniciar sesión</button>
        <button class="register-btn">
            Registrarse</button>
        <button class="close-profile">
            Volver</button>

    </div>
        
</div>
<div class="customize-btn">

    <div class="circle">
        <i class="icon-palette"></i>
    </div>

    <span>Personalizar</span>

</div>

<!-- =====================================
     PANEL DE APARIENCIA
===================================== -->

<div class="appearance-panel">

    <h2>Apariencia</h2>

    <button class="upload-background">

        Subir imagen

    </button>

    <input
        type="file"
        id="background-input"
        accept="image/*"
        hidden>

    <div class="theme-list">

        <button
            class="theme-btn"
            data-theme="default">

            Fondo clásico

        </button>

    </div>

    <button class="close-appearance">

        Volver

    </button>

</div>

<script src="script.js"></script>

</body>

</html>
