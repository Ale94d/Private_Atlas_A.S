<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Daily Journal | Private Atlas A.S.</title>

    <!-- FUENTES -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- ICONOS -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- FAVICON -->
    <link rel="icon"
          type="image/png"
          href="assets/icons/favicon-daily-journal.png">

</head>


<body>

    <!-- =====================================
         DAILY JOURNAL
    ====================================== -->

    <main class="daily-journal">


        <!-- =====================================
             ILUMINACIÓN AMBIENTAL
        ====================================== -->

        <div class="ambient-light"></div>

        <div class="floating-particles">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- =====================================
             BARRA SUPERIOR
        ====================================== -->

        <header class="journal-header">


            <!-- BOTÓN HOME -->

            <button
                class="home-button"
                type="button"
                aria-label="Volver al Home">

                <i data-lucide="house"></i>

            </button>


            <!-- TÍTULO -->

            <div class="journal-title">

                <span>
                    PRIVATE ATLAS
                </span>

                <h1>
                    Daily Journal
                </h1>

            </div>


            <!-- HERRAMIENTAS -->

            <div class="journal-tools">

                <button
                    class="tool-button"
                    type="button"
                    aria-label="Buscar">

                    <i data-lucide="search"></i>

                </button>

                <button
                    class="tool-button"
                    type="button"
                    aria-label="Calendario">

                    <i data-lucide="calendar-days"></i>

                </button>

            </div>

        </header>


        <!-- =====================================
             HABITACIÓN DE BOTICA
        ====================================== -->

        <section class="apothecary-room">


            <!-- =================================
                 ESTANTERÍA IZQUIERDA
            ================================== -->

            <aside class="apothecary-shelf shelf-left">

                <div class="shelf-top"></div>


                <div class="shelf-row">

                    <div class="bottle bottle-small">
                        <span></span>
                    </div>

                    <div class="bottle bottle-tall">
                        <span></span>
                    </div>

                    <div class="bottle bottle-round">
                        <span></span>
                    </div>

                </div>


                <div class="wooden-shelf"></div>


                <div class="shelf-row">

                    <div class="bottle bottle-tall">
                        <span></span>
                    </div>

                    <div class="bottle bottle-small">
                        <span></span>
                    </div>

                    <div class="bottle bottle-square">
                        <span></span>
                    </div>

                </div>


                <div class="wooden-shelf"></div>


                <div class="shelf-row">

                    <div class="drawer">
                        <span>HERBAS</span>
                    </div>

                    <div class="drawer">
                        <span>RAÍCES</span>
                    </div>

                </div>


                <div class="wooden-shelf"></div>

            </aside>



            <!-- =================================
                 ESTANTERÍA DERECHA
            ================================== -->

            <aside class="apothecary-shelf shelf-right">

                <div class="shelf-top"></div>


                <div class="shelf-row">

                    <div class="bottle bottle-round">
                        <span></span>
                    </div>

                    <div class="bottle bottle-small">
                        <span></span>
                    </div>

                    <div class="bottle bottle-tall">
                        <span></span>
                    </div>

                </div>


                <div class="wooden-shelf"></div>


                <div class="shelf-row">

                    <div class="bottle bottle-square">
                        <span></span>
                    </div>

                    <div class="bottle bottle-tall">
                        <span></span>
                    </div>

                    <div class="bottle bottle-small">
                        <span></span>
                    </div>

                </div>


                <div class="wooden-shelf"></div>


                <div class="shelf-row">

                    <div class="drawer">
                        <span>FLORES</span>
                    </div>

                    <div class="drawer">
                        <span>SEMILLAS</span>
                    </div>

                </div>


                <div class="wooden-shelf"></div>

            </aside>



            <!-- =================================
                 PLANTA IZQUIERDA
            ================================== -->

            <div class="botanical botanical-left">

                <div class="plant-stem"></div>

                <div class="leaf leaf-one"></div>
                <div class="leaf leaf-two"></div>
                <div class="leaf leaf-three"></div>
                <div class="leaf leaf-four"></div>

            </div>



            <!-- =================================
                 PLANTA DERECHA
            ================================== -->

            <div class="botanical botanical-right">

                <div class="plant-stem"></div>

                <div class="leaf leaf-one"></div>
                <div class="leaf leaf-two"></div>
                <div class="leaf leaf-three"></div>
                <div class="leaf leaf-four"></div>

            </div>



            <!-- =================================
                 MUEBLE CENTRAL
            ================================== -->

            <div class="apothecary-counter">


                <!-- PARTE SUPERIOR -->

                <div class="counter-top">

                    <div class="counter-label">

                        <span>
                            ARCHIVO PERSONAL
                        </span>

                        <strong>
                            REGISTRO DIARIO
                        </strong>

                    </div>

                </div>


                <!-- CUERPO -->

                <div class="counter-body">


                    <!-- FRASCOS -->

                    <div class="counter-bottles">

                        <div class="mini-bottle">
                            <span>CALMA</span>
                        </div>

                        <div class="mini-bottle">
                            <span>ALEGRÍA</span>
                        </div>

                        <div class="mini-bottle">
                            <span>SUEÑOS</span>
                        </div>

                    </div>


                    <!-- ZONA CENTRAL -->

                    <div class="journal-display">


                        <div class="date-label">

                            <span>
                                REGISTRO DEL DÍA
                            </span>

                            <strong>
                                03 · SEPTIEMBRE · 2026
                            </strong>

                        </div>


                        <h2>
                            ¿Cómo fue tu día?
                        </h2>


                        <p>
                            Conserva aquí aquello que quieras
                            recordar de este momento.
                        </p>


                        <div class="journal-paper">

                            <span>
                                Escribe tu recuerdo...
                            </span>

                        </div>


                    </div>


                    <!-- FRASCOS -->

                    <div class="counter-bottles">

                        <div class="mini-bottle">
                            <span>ENERGÍA</span>
                        </div>

                        <div class="mini-bottle">
                            <span>PAZ</span>
                        </div>

                        <div class="mini-bottle">
                            <span>MEMORIA</span>
                        </div>

                    </div>

                </div>


                <!-- CAJONES -->

                <div class="counter-drawers">

                    <button
                        class="counter-drawer"
                        type="button">

                        <span>
                            DIARIO
                        </span>

                    </button>

                    <button
                        class="counter-drawer"
                        type="button">

                        <span>
                            LIBROS
                        </span>

                    </button>

                    <button
                        class="counter-drawer"
                        type="button">

                        <span>
                            RECETAS
                        </span>

                    </button>

                    <button
                        class="counter-drawer"
                        type="button">

                        <span>
                            EMOCIONES
                        </span>

                    </button>

                    <button
                        class="counter-drawer"
                        type="button">

                        <span>
                            PELÍCULAS
                        </span>

                    </button>

                </div>

            </div>



            <!-- =================================
                 LÁMPARA
            ================================== -->

            <div class="apothecary-lamp">

                <div class="lamp-glow"></div>

                <div class="lamp-shade"></div>

                <div class="lamp-body"></div>

            </div>



            <!-- =================================
                 VELA
            ================================== -->

            <div class="candle">

                <div class="flame"></div>

                <div class="candle-body"></div>

            </div>


        </section>



        <!-- =====================================
             MENÚ INFERIOR
        ====================================== -->

        <nav class="journal-navigation">


            <button
                class="nav-label active"
                type="button">

                <i data-lucide="notebook-pen"></i>

                <span>
                    Diario
                </span>

            </button>


            <button
                class="nav-label"
                type="button">

                <i data-lucide="book-open"></i>

                <span>
                    Libros
                </span>

            </button>


            <button
                class="nav-label"
                type="button">

                <i data-lucide="utensils"></i>

                <span>
                    Recetas
                </span>

            </button>


            <button
                class="nav-label"
                type="button">

                <i data-lucide="heart"></i>

                <span>
                    Emociones
                </span>

            </button>


            <button
                class="nav-label"
                type="button">

                <i data-lucide="clapperboard"></i>

                <span>
                    Películas
                </span>

            </button>


        </nav>


    </main>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>

</body>

</html>
