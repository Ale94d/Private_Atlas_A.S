<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Atlas A.S - Life Planner Submarino</title>
    <link rel="stylesheet" href="Style.css">
    <!-- FontAwesome para iconos --
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Video de fondo fijo (Asegúrate de que el nombre y ruta del archivo de video coincidan exactamente) -->
    <div class="video-background">
        <video autoplay muted loop playsinline id="bgVideo">
            <source src="../VID-20260906-WA0000.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Botón flotante para volver atrás (La Casa) -->
    <a href="../indice.html" class="home-return-btn" title="Volver al Atlas Principal">
        <i class="fa-solid fa-house"></i>
    </a>

    <!-- Contenedor Principal Estilo "Glassmorphism" con referencias modernas -->
    <div class="main-dashboard-container">
        
        <!-- Cabecera del Módulo -->
        <header class="dashboard-header">
            <h1 class="dashboard-title">Life Planner Submarino</h1>
            <p class="dashboard-subtitle">"Tus memorias y finanzas bajo las mareas del tiempo"</p>
        </header>

        <!-- Cuadrícula de 2 columnas (Estilo Referencia) -->
        <div class="dashboard-grid">
            
            <!-- TARJETA 1: BITÁCORA DE TAREAS -->
            <section class="glass-card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-anchor"></i> Bitácora de Tareas</h2>
                </div>
                
                <div class="form-group">
                    <input type="text" id="taskInput" placeholder="Nueva tarea o inmersión...">
                    <input type="date" id="taskDate">
                    <button type="button" id="addTaskBtn" class="action-btn">Añadir Inmersión</button>
                </div>

                <div class="list-scroll-container">
                    <ul id="taskList">
                        <!-- Las tareas se inyectan dinámicamente -->
                    </ul>
                </div>
            </section>

            <!-- TARJETA 2: TESORERÍA 50/30/20 -->
            <section class="glass-card">
                <div class="card-header">
                    <h2><i class="fa-solid fa-coins"></i> Tesorería (50/30/20)</h2>
                </div>
                
                <div class="form-group">
                    <input type="text" id="expenseDesc" placeholder="Descripción del gasto...">
                    <input type="number" id="expenseAmount" placeholder="Valor ($)">
                    <select id="expenseCategory">
                        <option value="necesidades">Necesidades (50%)</option>
                        <option value="deseos">Deseos (30%)</option>
                        <option value="ahorro">Ahorro / Inversión (20%)</option>
                    </select>
                    <button type="button" id="addExpenseBtn" class="action-btn">Registrar Gasto</button>
                </div>

                <!-- Resumen Presupuestario -->
                <div class="budget-summary-box">
                    <div class="budget-item">
                        <span>Necesidades</span>
                        <strong id="totalNecesidades">$0</strong>
                    </div>
                    <div class="budget-item">
                        <span>Deseos</span>
                        <strong id="totalDeseos">$0</strong>
                    </div>
                    <div class="budget-item">
                        <span>Ahorro</span>
                        <strong id="totalAhorro">$0</strong>
                    </div>
                </div>

                <div class="list-scroll-container">
                    <ul id="expenseList">
                        <!-- Los gastos se inyectan dinámicamente -->
                    </ul>
                </div>
            </section>

        </div>
    </div>

    <script>
        // --- LÓGICA DE TAREAS ---
        const taskInput = document.getElementById('taskInput');
        const taskDate = document.getElementById('taskDate');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');

        addTaskBtn.addEventListener('click', () => {
            const text = taskInput.value.trim();
            const date = taskDate.value;
            if(!text) return;

            const li = document.createElement('li');
            li.innerHTML = `
                <div class="item-details">
                    <span class="item-text">${text}</span>
                    <span class="item-sub"><i class="fa-regular fa-calendar"></i> ${date || 'Sin fecha'}</span>
                </div>
                <div class="item-actions">
                    <button class="check-btn" onclick="toggleTask(this)"><i class="fa-solid fa-check"></i></button>
                    <button class="trash-btn" onclick="deleteItem(this)"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            taskList.appendChild(li);
            taskInput.value = '';
            taskDate.value = '';
        });

        function toggleTask(btn) {
            const li = btn.closest('li');
            li.classList.toggle('completed');
        }

        function deleteItem(btn) {
            btn.closest('li').remove();
        }

        // --- LÓGICA DE FINANZAS 50/30/20 ---
        const expenseDesc = document.getElementById('expenseDesc');
        const expenseAmount = document.getElementById('expenseAmount');
        const expenseCategory = document.getElementById('expenseCategory');
        const addExpenseBtn = document.getElementById('addExpenseBtn');
        const expenseList = document.getElementById('expenseList');

        let categoryTotals = { necesidades: 0, deseos: 0, ahorro: 0 };

        addExpenseBtn.addEventListener('click', () => {
            const desc = expenseDesc.value.trim();
            const amount = parseFloat(expenseAmount.value);
            const cat = expenseCategory.value;

            if(!desc || isNaN(amount) || amount <= 0) return;

            categoryTotals[cat] += amount;

            const li = document.createElement('li');
            li.dataset.category = cat;
            li.dataset.amount = amount;
            li.innerHTML = `
                <div class="item-details">
                    <span class="item-text"><strong>${desc}</strong></span>
                    <span class="item-sub uppercase">${cat} - $${amount.toLocaleString()}</span>
                </div>
                <button class="trash-btn" onclick="removeExpense(this)"><i class="fa-solid fa-trash"></i></button>
            `;
            expenseList.appendChild(li);

            expenseDesc.value = '';
            expenseAmount.value = '';
            updateBudget();
        });

        function removeExpense(btn) {
            btn.closest('li').remove();
            updateBudget();
        }

        function updateBudget() {
            categoryTotals = { necesidades: 0, deseos: 0, ahorro: 0 };
            document.querySelectorAll('#expenseList li').forEach(item => {
                const cat = item.dataset.category;
                const amt = parseFloat(item.dataset.amount);
                categoryTotals[cat] += amt;
            });

            document.getElementById('totalNecesidades').innerText = `$${categoryTotals.necesidades.toLocaleString()}`;
            document.getElementById('totalDeseos').innerText = `$${categoryTotals.deseos.toLocaleString()}`;
            document.getElementById('totalAhorro').innerText = `$${categoryTotals.ahorro.toLocaleString()}`;
        }
    </script>
</body>
</html>
