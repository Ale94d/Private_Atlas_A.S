<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Atlas A.S - Life Planner Submarino</title>
    <link rel="stylesheet" href="Style.css">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Video de fondo fijo -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="../VID-20260906-WA0000.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Botón flotante para volver atrás (La Casa) con animación -->
    <a href="../indice.html" class="home-return-btn" title="Volver al Atlas Principal">
        <i class="fa-solid fa-house"></i>
    </a>

    <div class="main-wrapper">
        <div class="container">
            
            <!-- Cabecera del Módulo -->
            <header class="top-editorial-section">
                <h2 class="top-subtitle">Life Planner Submarino</h2>
                <div class="top-editorial-desc" style="text-align: center;">
                    <p>"Tus memorias y finanzas bajo las mareas del tiempo"</p>
                </div>
            </header>

            <!-- Contenedor de Secciones (Grid) -->
            <div class="planner-grid" style="width: 100%; display: flex; flex-direction: column; gap: 30px;">
                
                <!-- SECCIÓN 1: TAREAS Y CALENDARIO -->
                <section class="seccion-card">
                    <h3><i class="fa-solid fa-anchor"></i> Bitácora de Tareas</h3>
                    <div class="form-control-group" style="width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px;">
                        <input type="text" id="taskInput" placeholder="Nueva tarea o inmersión..." style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #e0cca9; outline: none;">
                        <input type="date" id="taskDate" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #e0cca9; outline: none;">
                        <button type="button" id="addTaskBtn" class="sub-btn" style="padding: 12px; border-radius: 10px; background: #533a2c; border: 1px solid #ed8ea2; color: #ed8ea2; cursor: pointer; font-weight: bold;">Añadir Tarea</button>
                    </div>
                    <div class="tasks-container" style="width: 100%;">
                        <ul id="taskList" style="list-style: none; display: flex; flex-direction: column; gap: 10px; width: 100%;">
                            <!-- Las tareas se inyectan dinámicamente -->
                        </ul>
                    </div>
                </section>

                <!-- SECCIÓN 2: FINANZAS Y MÉTODO 50/30/20 -->
                <section class="seccion-card">
                    <h3><i class="fa-solid fa-coins"></i> Tesorería (50/30/20)</h3>
                    <div class="form-control-group" style="width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px;">
                        <input type="text" id="expenseDesc" placeholder="Descripción del gasto..." style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #e0cca9; outline: none;">
                        <input type="number" id="expenseAmount" placeholder="Valor ($)" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #e0cca9; outline: none;">
                        <select id="expenseCategory" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(30,20,15,0.9); color: #e0cca9; outline: none;">
                            <option value="necesidades">Necesidades (50%)</option>
                            <option value="deseos">Deseos (30%)</option>
                            <option value="ahorro">Ahorro / Inversión (20%)</option>
                        </select>
                        <button type="button" id="addExpenseBtn" class="sub-btn" style="padding: 12px; border-radius: 10px; background: #533a2c; border: 1px solid #ed8ea2; color: #ed8ea2; cursor: pointer; font-weight: bold;">Registrar Gasto</button>
                    </div>
                    
                    <!-- Resumen de Distribución 50/30/20 -->
                    <div class="budget-summary" style="width: 100%; display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px; margin-bottom: 15px;">
                        <div class="budget-box" style="text-align: center; font-size: 0.75rem;"><span>Necesidades</span><br><strong id="totalNecesidades" style="color:#ed8ea2;">$0</strong></div>
                        <div class="budget-box" style="text-align: center; font-size: 0.75rem;"><span>Deseos</span><br><strong id="totalDeseos" style="color:#ed8ea2;">$0</strong></div>
                        <div class="budget-box" style="text-align: center; font-size: 0.75rem;"><span>Ahorro</span><br><strong id="totalAhorro" style="color:#ed8ea2;">$0</strong></div>
                    </div>

                    <div class="expenses-container" style="width: 100%;">
                        <ul id="expenseList" style="list-style: none; display: flex; flex-direction: column; gap: 10px; width: 100%;">
                            <!-- Los gastos se inyectan dinámicamente -->
                        </ul>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <script>
        // --- LÓGICA DE TAREAS ---
        const taskInput = document.getElementById('taskInput');
        const taskDate = document.getElementById('taskDate');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');

        addTaskBtn.addEventListener('click', () => {
            const text = taskInput.value.trim();
            const date = taskDate.value;
            if(!text) return;

            const li = document.createElement('li');
            li.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);";
            li.innerHTML = `
                <div style="display: flex; flex-direction: column;">
                    <span>${text}</span>
                    <small style="color: #ed8ea2; opacity: 0.8;">${date || 'Sin fecha'}</small>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="toggleTask(this)" style="background:none; border:none; color:#86efac; cursor:pointer;"><i class="fa-solid fa-check"></i></button>
                    <button onclick="deleteItem(this)" style="background:none; border:none; color:#f87171; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            taskList.appendChild(li);
            taskInput.value = '';
            taskDate.value = '';
        });

        function toggleTask(btn) {
            const li = btn.closest('li');
            li.style.opacity = li.style.opacity === '0.4' ? '1' : '0.4';
            li.style.textDecoration = li.style.textDecoration === 'line-through' ? 'none' : 'line-through';
        }

        function deleteItem(btn) {
            btn.closest('li').remove();
        }

        // --- LÓGICA DE FINANZAS 50/30/20 ---
        const expenseDesc = document.getElementById('expenseDesc');
        const expenseAmount = document.getElementById('expenseAmount');
        const expenseCategory = document.getElementById('expenseCategory');
        const addExpenseBtn = document.getElementById('addExpenseBtn');
        const expenseList = document.getElementById('expenseList');

        let categoryTotals = { necesidades: 0, deseos: 0, ahorro: 0 };

        addExpenseBtn.addEventListener('click', () => {
            const desc = expenseDesc.value.trim();
            const amount = parseFloat(expenseAmount.value);
            const cat = expenseCategory.value;

            if(!desc || isNaN(amount) || amount <= 0) return;

            categoryTotals[cat] += amount;

            const li = document.createElement('li');
            li.dataset.category = cat;
            li.dataset.amount = amount;
            li.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);";
            li.innerHTML = `
                <div style="display: flex; flex-direction: column;">
                    <span><strong>${desc}</strong></span>
                    <small style="color: #ed8ea2; text-transform: uppercase;">${cat} - $${amount.toLocaleString()}</small>
                </div>
                <button onclick="removeExpense(this)" style="background:none; border:none; color:#f87171; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
            `;
            expenseList.appendChild(li);

            expenseDesc.value = '';
            expenseAmount.value = '';
            updateBudget();
        });

        function removeExpense(btn) {
            btn.closest('li').remove();
            updateBudget();
        }

        function updateBudget() {
            categoryTotals = { necesidades: 0, deseos: 0, ahorro: 0 };
            document.querySelectorAll('#expenseList li').forEach(item => {
                const cat = item.dataset.category;
                const amt = parseFloat(item.dataset.amount);
                categoryTotals[cat] += amt;
            });

            document.getElementById('totalNecesidades').innerText = `$${categoryTotals.necesidades.toLocaleString()}`;
            document.getElementById('totalDeseos').innerText = `$${categoryTotals.deseos.toLocaleString()}`;
            document.getElementById('totalAhorro').innerText = `$${categoryTotals.ahorro.toLocaleString()}`;
        }
    </script>
</body>
</html>
