<style>
    /* Estilos generales y diseño VisionOS Abisal */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Outfit', sans-serif;
    }

    body {
        background: #030712;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        position: relative;
    }

    /* Fondo marino y burbujas */
    body::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 100%);
        z-index: -2;
    }

    .bubbles-container {
        position: absolute;
        width: 100%; height: 100%;
        overflow: hidden;
        z-index: -1;
        pointer-events: none;
    }

    .bubble {
        position: absolute;
        background: rgba(56, 189, 248, 0.15);
        border-radius: 50%;
        animation: riseUp linear infinite;
    }

    @keyframes riseUp {
        0% { transform: translateY(105vh) scale(0.8); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Contenedor principal VisionOS */
    .spatial-viewport {
        display: flex;
        gap: 20px;
        width: 95%;
        max-width: 1350px;
        padding: 20px;
        align-items: stretch;
    }

    /* Barra lateral izquierda */
    .floating-left-dock {
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 12px;
        gap: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .dock-icon {
        width: 48px; height: 48px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        font-size: 18px;
        text-decoration: none;
        transition: all 0.3s ease;
    }

    .dock-icon:hover, .dock-icon.active {
        background: rgba(56, 189, 248, 0.2);
        color: #38bdf8;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    /* Tarjeta Holográfica Central */
    .hologram-main-card {
        flex: 1;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 35px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        transition: all 0.4s ease;
    }

    .hidden-view {
        display: none !important;
    }

    .holo-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #94a3b8;
        font-size: 14px;
    }

    .holo-nav-links {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .user-avatar-small {
        width: 36px; height: 36px;
        background: rgba(56, 189, 248, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .holo-intro h2 {
        font-size: 38px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 10px;
        line-height: 1.2;
    }

    .holo-intro p {
        color: #94a3b8;
        font-size: 15px;
        margin-bottom: 25px;
    }

    /* Tarjetas del carrusel */
    .holo-cards-carousel {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
        margin-bottom: 25px;
    }

    .carousel-card {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        padding: 35px 25px;
        min-height: 240px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        transition: all 0.3s ease;
    }

    .carousel-card:hover {
        border-color: rgba(56, 189, 248, 0.4);
        transform: translateY(-4px);
        box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15);
    }

    .card-top-tag {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .card-top-tag i {
        color: #f43f5e;
    }

    .card-content-text h4 {
        font-size: 22px;
        color: #fff;
        margin-bottom: 8px;
    }

    .card-content-text p {
        font-size: 14px;
        color: #38bdf8;
    }

    .carousel-step {
        font-size: 32px;
        font-weight: 800;
        color: rgba(255, 255, 255, 0.12);
    }

    .holo-action-footer {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .holo-btn {
        padding: 12px 24px;
        border-radius: 14px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        border: none;
        transition: all 0.3s ease;
    }

    .primary-btn {
        background: #38bdf8;
        color: #030712;
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .primary-btn:hover {
        background: #7dd3fc;
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
    }

    .secondary-btn {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .secondary-btn:hover {
        background: rgba(255, 255, 255, 0.15);
    }

    .footer-icon-pill {
        width: 44px; height: 44px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        cursor: pointer;
        transition: 0.3s;
    }

    .footer-icon-pill:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
    }

    /* Vista 2: Finanzas 50/30/20 */
    .finance-layout-grid {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 20px;
        margin-top: 15px;
    }

    .finance-categories-dock {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .fin-cat-item {
        background: rgba(30, 41, 59, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 14px 18px;
        border-radius: 14px;
        color: #94a3b8;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .fin-cat-item:hover, .fin-cat-item.active {
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        border-color: rgba(56, 189, 248, 0.3);
    }

    .finance-form-container {
        background: rgba(30, 41, 59, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .plan-journey-title h3 {
        font-size: 20px;
        color: #fff;
        margin-bottom: 4px;
    }

    .plan-journey-title p {
        font-size: 13px;
        color: #94a3b8;
    }

    .summary-cards-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    .summary-card-mini {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
    }

    .summary-card-mini span {
        font-size: 11px;
        color: #94a3b8;
        display: block;
        margin-bottom: 4px;
    }

    .summary-card-mini h4 {
        font-size: 16px;
        color: #38bdf8;
    }

    .finance-row-inputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .finance-input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .finance-input-group label {
        font-size: 12px;
        color: #94a3b8;
    }

    .fin-input-box {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        color: #38bdf8;
    }

    .fin-input-box input, .fin-input-box select {
        width: 100%;
        background: transparent;
        border: none;
        padding: 11px 8px;
        color: #fff;
        font-size: 14px;
        outline: none;
    }

    .fin-input-box select option {
        background: #0f172a;
    }

    .finance-actions-footer {
        display: flex;
        gap: 12px;
    }

    .expenses-list-container {
        max-height: 130px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-right: 4px;
    }

    .expense-item-row {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .expense-info-main b {
        font-size: 13px;
        color: #fff;
        display: block;
    }

    .expense-info-main small {
        font-size: 11px;
        color: #94a3b8;
    }

    .expense-item-right {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .expense-item-right span {
        font-size: 14px;
        color: #38bdf8;
        font-weight: 600;
    }

    .delete-expense-btn {
        background: transparent;
        border: none;
        color: #f43f5e;
        cursor: pointer;
        font-size: 13px;
        padding: 4px;
        transition: 0.2s;
    }

    .delete-expense-btn:hover {
        transform: scale(1.2);
    }

    .budget-feedback {
        font-size: 12px;
        color: #38bdf8;
    }

    /* Tarjeta Lateral Derecha */
    .hologram-side-card {
        width: 280px;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 32px;
        padding: 25px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
    }

    .side-badge {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 12px;
    }

    .side-badge-header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .realtime-clock {
        font-size: 32px;
        font-weight: 700;
        color: #fff;
        letter-spacing: 1px;
    }

    .realtime-date {
        font-size: 13px;
        color: #38bdf8;
    }

    .side-location {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #94a3b8;
        background: rgba(255, 255, 255, 0.05);
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .read-more-link {
        font-size: 10px;
        color: #38bdf8;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 10px;
        padding: 4px 10px;
        background: rgba(56, 189, 248, 0.1);
        border-radius: 8px;
    }
</style>
