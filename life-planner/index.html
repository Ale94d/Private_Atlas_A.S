<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Atlas A.S - Life Planner Submarino</title>
    <link rel="stylesheet" href="Style.css">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Fondo de Océano Profundo con Ruinas y Elementos Animados -->
    <div class="ocean-background">
        <div class="light-rays"></div>
        <div class="ruins-silhouette"></div>
        <div class="bubbles">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="sea-particles"></div>
    </div>

    <!-- Botón flotante para volver atrás (La Casa) con animación -->
    <a href="../indice.html" class="home-return-btn" title="Volver al Atlas Principal">
        <i class="fa-solid fa-house"></i>
    </a>

    <div class="planner-wrapper">
        <!-- Cabecera del Módulo -->
        <header class="planner-header">
            <h1 class="planner-title">Life Planner Submarino</h1>
            <p class="planner-subtitle">"Tus memorias y finanzas bajo las mareas del tiempo"</p>
        </header>

        <!-- Contenedor de Secciones Principales -->
        <div class="planner-grid">
            
            <!-- SECCIÓN 1: TAREAS Y CALENDARIO -->
            <section class="planner-card">
                <div class="card-title-bar">
                    <h2><i class="fa-solid fa-anchor"></i> Bitácora de Tareas</h2>
                </div>
                <div class="form-control-group">
                    <input type="text" id="taskInput" placeholder="Nueva tarea o inmersión...">
                    <input type="date" id="taskDate">
                    <button type="button" id="addTaskBtn" class="sub-btn">Añadir</button>
                </div>
                <div class="tasks-container">
                    <ul id="taskList">
                        <!-- Las tareas se inyectan dinámicamente -->
                    </ul>
                </div>
            </section>

            <!-- SECCIÓN 2: FINANZAS Y MÉTODO 50/30/20 -->
            <section class="planner-card">
                <div class="card-title-bar">
                    <h2><i class="fa-solid fa-coins"></i> Tesorería (50/30/20)</h2>
                </div>
                <div class="form-control-group finance-form">
                    <input type="text" id="expenseDesc" placeholder="Descripción del gasto...">
                    <input type="number" id="expenseAmount" placeholder="Valor ($)">
                    <select id="expenseCategory">
                        <option value="necesidades">Necesidades (50%)</option>
                        <option value="deseos">Deseos (30%)</option>
                        <option value="ahorro">Ahorro/Inversión (20%)</option>
                    </select>
                    <button type="button" id="addExpenseBtn" class="sub-btn">Registrar</button>
                </div>
                
                <!-- Resumen de Distribución 50/30/20 -->
                <div class="budget-summary">
                    <div class="budget-box">
                        <span>Necesidades (50%)</span>
                        <strong id="totalNecesidades">$0</strong>
                    </div>
                    <div class="budget-box">
                        <span>Deseos (30%)</span>
                        <strong id="totalDeseos">$0</strong>
                    </div>
                    <div class="budget-box">
                        <span>Ahorro (20%)</span>
                        <strong id="totalAhorro">$0</strong>
                    </div>
                </div>

                <div class="expenses-container">
                    <ul id="expenseList">
                        <!-- Los gastos se inyectan dinámicamente -->
                    </ul>
                </div>
            </section>

        </div>
    </div>

    <script>
        // --- LÓGICA DE TAREAS ---
        const taskInput = document.getElementById('taskInput');
        const taskDate = document.getElementById('taskDate');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');

        addTaskBtn.addEventListener('click', () => {
            const text = taskInput.value.trim();
            const date = taskDate.value;
            if(!text) return;

            const li = document.createElement('li');
            li.innerHTML = `
                <div class="task-info">
                    <span class="t-text">${text}</span>
                    <span class="t-date"><i class="fa-regular fa-calendar"></i> ${date || 'Sin fecha'}</span>
                </div>
                <div class="task-actions">
                    <button class="complete-btn" onclick="toggleTask(this)"><i class="fa-solid fa-check"></i></button>
                    <button class="delete-btn" onclick="deleteItem(this)"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            taskList.appendChild(li);
            taskInput.value = '';
            taskDate.value = '';
        });

        function toggleTask(btn) {
            const li = btn.closest('li');
            li.classList.toggle('completed');
        }

        function deleteItem(btn) {
            btn.closest('li').remove();
            updateBudget();
        }

        // --- LÓGICA DE FINANZAS 50/30/20 ---
        const expenseDesc = document.getElementById('expenseDesc');
        const expenseAmount = document.getElementById('expenseAmount');
        const expenseCategory = document.getElementById('expenseCategory');
        const addExpenseBtn = document.getElementById('addExpenseBtn');
        const expenseList = document.getElementById('expenseList');

        let categoryTotals = { necesidades: 0, deseos: 0, ahorro: 0 };

        addExpenseBtn.addEventListener('click', () => {
            const desc = expenseDesc.value.trim();
            const amount = parseFloat(expenseAmount.value);
            const cat = expenseCategory.value;

            if(!desc || isNaN(amount) || amount <= 0) return;

            categoryTotals[cat] += amount;

            const li = document.createElement('li');
            li.dataset.category = cat;
            li.dataset.amount = amount;
            li.innerHTML = `
                <div class="expense-info">
                    <span><strong>${desc}</strong> (${cat.toUpperCase()})</span>
                    <span class="exp-val">$${amount.toLocaleString()}</span>
                </div>
                <button class="delete-btn" onclick="removeExpense(this)"><i class="fa-solid fa-trash"></i></button>
            `;
            expenseList.appendChild(li);

            expenseDesc.value = '';
            expenseAmount.value = '';
            updateBudget();
        });

        function updateBudget() {
            categoryTotals = { necesidades: 0, deseos: 0, ahorro: 0 };
            document.querySelectorAll('#expenseList li').forEach(item => {
                const cat = item.dataset.category;
                const amt = parseFloat(item.dataset.amount);
                categoryTotals[cat] += amt;
            });

            document.getElementById('totalNecesidades').innerText = `$${categoryTotals.necesidades.toLocaleString()}`;
            document.getElementById('totalDeseos').innerText = `$${categoryTotals.deseos.toLocaleString()}`;
            document.getElementById('totalAhorro').innerText = `$${categoryTotals.ahorro.toLocaleString()}`;
        }
    </script>
</body>
</html>
