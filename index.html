<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Private Atlas A.S.</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="styles.css">

</head>

<body>

    <!-- ===========================
            CABECERA
    ============================ -->

    <header class="hero">

        <img
            src="assets/images/logo.png"
            alt="Private Atlas"
            class="logo">

        <p class="slogan">

            Tus recuerdos viajan contigo

        </p>

    </header>

    <!-- ===========================
            HOME
    ============================ -->

    <main class="home">

        <div class="workspace atlas">

            <div class="circle">

                🌍

            </div>

            <span>Atlas</span>

        </div>

        <div class="workspace planner">

            <div class="circle">

                📅

            </div>

            <span>Life Planner</span>

        </div>

        <div class="workspace journal">

            <div class="circle">

                📖

            </div>

            <span>Daily Journal</span>

        </div>

        <div class="workspace baul">

            <div class="circle">

                📦

            </div>

            <span>Baúl</span>

        </div>

        <div class="workspace timeline">

            <div class="circle">

                🕰️

            </div>

            <span>Timeline</span>

        </div>

    </main>

    <!-- ===========================
        BOTÓN PERSONALIZAR
    ============================ -->

    <button
        class="customize-btn"
        title="Personalizar">

        🎨

    </button>

    <template id=""appearance-template">
        
        <div class="appearance-panel">
            <h2>Apariencia<h2>

            <button class="upload-background"> Subir Fondo</button>

            <input
            type="file"
            id="background-input"
            accept="image/*"
            hidden
            >
        <div class="theme-list">

        <button class="theme-btn" 
        data-theme="default">
        Fondo clasico
        </button>

        <button class="close-appearance">
            <- Volver
        </button>
    
    
    </template>

    <script src="script.js"></script>

</body>

</html>
