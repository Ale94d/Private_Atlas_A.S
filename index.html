<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Atlas A.S.</title>

    <link href="https://fonts.cdnfonts.com/css/whiskey-2" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        
        img
    src="assets/images/logo.png"
    alt="Private Atlas"
    class="logo"
>

        <p class="slogan">
            Tus recuerdos viajan contigo
        </p>

    </header>

<main class="home">

    <div class="background-decoration"></div>

    <div class="workspace-container">

        <div class="workspace atlas">
            <div class="circle">🌍</div>
            <p>Atlas</p>
        </div>

        <div class="workspace planner">
            <div class="circle">📅</div>
            <p>Life Planner</p>
        </div>

        <div class="workspace journal">
            <div class="circle">📖</div>
            <p>Daily Journal</p>
        </div>

        <div class="workspace baul">
            <div class="circle">📦</div>
            <p>Baúl</p>
        </div>

        <div class="workspace timeline">
            <div class="circle">🕰️</div>
            <p>Timeline</p>
        </div>

    </div>

</main>

    <footer>

        <button class="customize-btn">
            ⚙️ Personalizar
        </button>

    </footer>

    <script src="script.js"></script>

</body>
</html>
