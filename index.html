<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Private Atlas A.S.</title>

    <link href="https://fonts.cdnfonts.com/css/whiskey-2" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- =========================
            HEADER
    ========================== -->

    <header class="hero">

        <img
            src="assets/images/logo.png"
            alt="Private Atlas"
            class="logo"
        >

        <h1>
            Private Atlas
        </h1>

        <p>
            Tus recuerdos viajan contigo
        </p>

    </header>


    <!-- =========================
            HOME
    ========================== -->

    <main class="home">

        <div class="workspace atlas">

            <div class="circle">

                <span>A</span>

            </div>

            <h3>Atlas</h3>

        </div>


        <div class="workspace planner">

            <div class="circle">

                <span>L</span>

            </div>

            <h3>Life Planner</h3>

        </div>


        <div class="workspace journal">

            <div class="circle">

                <span>D</span>

            </div>

            <h3>Daily Journal</h3>

        </div>


        <div class="workspace baul">

            <div class="circle">

                <span>B</span>

            </div>

            <h3>Baúl</h3>

        </div>


        <div class="workspace timeline">

            <div class="circle">

                <span>T</span>

            </div>

            <h3>Timeline</h3>

        </div>

    </main>


    <!-- =========================
            FOOTER
    ========================== -->

    <footer>

        <button class="customize">

            ⚙ Personalizar

        </button>

    </footer>


    <script src="script.js"></script>

</body>

</html>
